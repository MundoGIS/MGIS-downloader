<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nedladdningshanterare - LMV</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="downloads-page">
        <div id="site-header"></div>
    <div class="container">
        <div class="header">
            <h1>📦 Nedladdningshanterare</h1>
            <p>Hantera dina LMV-nedladdningar</p>
        </div>
        
        <div class="toolbar">
            <div class="stats">
                <div class="stat-item">
                    <span class="stat-label">Totalt mappar</span>
                    <span class="stat-value" id="totalFolders">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Total storlek</span>
                    <span class="stat-value" id="totalSize">0 MB</span>
                </div>
            </div>
            <div class="nav-links">
                <a href="lmv_hojd.html" class="btn btn-primary btn-sm">🗺️ Höjd</a>
                <a href="lmv.html" class="btn btn-secondary btn-sm">📍 Vektor</a>
                <button class="btn btn-success btn-sm" onclick="refreshList()">🔄 Uppdatera</button>
            </div>
        </div>
        
        <div class="content">
            <div id="jobsSection" class="jobs-section" style="display: none;">
                <div class="jobs-section-header">
                    <h2>⏱️ Pågående och senaste jobb</h2>
                    <button class="btn btn-secondary btn-sm" id="clearFinishedBtn" onclick="dismissFinishedJobs()" style="display: none;">Dölj avslutade</button>
                </div>
                <div id="jobsList"></div>
            </div>

            <div id="loadingState" class="loading">
                <div class="spinner"></div>
                <p>Laddar nedladdningar...</p>
            </div>
            
            <div id="emptyState" class="empty-state" style="display: none;">
                <div class="empty-state-icon">📭</div>
                <h2>Inga nedladdningar</h2>
                <p>Nedladdade mappar kommer att visas här</p>
                
            </div>
            
            <div id="downloadsGrid" class="downloads-grid" style="display: none;"></div>
        </div>
    </div>

    <div id="toast" role="status" aria-live="polite"></div>

    <dialog id="metaDialog" class="meta-dialog">
        <form id="metaForm" method="dialog">
            <h2>Namn och beskrivning</h2>
            <p class="meta-dialog-folder" id="metaFolder"></p>
            <label>Namn<input id="metaName" maxlength="100" placeholder="T.ex. Rabbalshede vindpark"></label>
            <label>Beskrivning<textarea id="metaDescription" maxlength="2000" rows="5" placeholder="Vad området används till, beställare, datum..."></textarea></label>
            <p id="metaError" role="alert"></p>
            <div class="meta-dialog-actions">
                <button type="button" class="btn btn-secondary btn-sm" onclick="document.getElementById('metaDialog').close()">Avbryt</button>
                <button type="submit" class="btn btn-primary btn-sm">Spara</button>
            </div>
        </form>
    </dialog>

    <script src="auth-nav.js" defer></script>
    <script>
        let downloads = [];
        let jobs = [];
        let catalogs = [];
        let canDeleteDownloads = false;
        const serviceKeys = new Map();
        let cleanupSupported = false;
        const publicationMessages = new Map();
        const chosenResolutions = new Map();
        const chosenStyles = new Map();
        const terrainThemes = { hillshade: 'Terrängskuggning', red: 'Röd höjdskala', green: 'Grön höjdskala' };
        const publishingFolders = new Set();
        const knownJobStatus = new Map();
        let firstJobsPoll = true;
        let lastFolderRefresh = 0;
        const DISMISSED_KEY = 'mgis_dismissed_jobs';

        function escapeHtml(value) {
            return String(value == null ? '' : value)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        function catalogTileUrl(catalog) {
            return catalog.tileUrl || `${location.origin}/terrain/${encodeURIComponent(catalog.alias)}/tiles/{z}/{x}/{y}.png`;
        }

        function serviceTileUrl(catalog, key = serviceKeys.get(catalog.alias)) {
            return catalog.isPublic === false ? `${catalogTileUrl(catalog)}?api_key=${key || '<API-KEY>'}` : catalogTileUrl(catalog);
        }

        function getDismissed() {
            try { return new Set(JSON.parse(localStorage.getItem(DISMISSED_KEY) || '[]')); } catch (e) { return new Set(); }
        }

        function isActive(job) {
            return job.status === 'running' || job.status === 'stopping';
        }

        function activeJobForFolder(folderName) {
            return jobs.find(j => isActive(j) && j.folders.includes(folderName)) || null;
        }
        
        function formatBytes(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }
        
        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleString('sv-SE', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit'
            });
        }
        
        async function loadDownloads() {
            try {
                const [response, catalogsResponse, accountResponse] = await Promise.all([
                    fetch('/lmv/downloads/list'), fetch('/terrain/catalogs'), fetch('/auth/me')
                ]);
                const data = await response.json();
                const catalogData = await catalogsResponse.json();
                canDeleteDownloads = accountResponse.ok && (await accountResponse.json()).user?.role === 'admin';
                if (!catalogData.success) throw new Error(catalogData.error || 'Kunde inte läsa kataloger');
                
                if (data.success) {
                    downloads = data.downloads;
                    catalogs = catalogData.catalogs;
                    cleanupSupported = catalogData.supportsCleanup === true;
                    await Promise.all(catalogs.filter(catalog => catalog.isPublic === false && !serviceKeys.has(catalog.alias)).map(fetchServiceKey));
                    renderDownloads();
                } else {
                    throw new Error(data.error);
                }
            } catch (error) {
                console.error('Fel vid laddning av nedladdningar:', error);
                alert('Kunde inte ladda nedladdningslistan');
            }
        }
        
        let deferredDownloadsRender = false;
        function downloadControlsInUse() {
            const grid = document.getElementById('downloadsGrid');
            return grid.contains(document.activeElement) && document.activeElement.matches('input, select, textarea');
        }

        document.getElementById('downloadsGrid').addEventListener('focusout', () => {
            setTimeout(() => {
                if (deferredDownloadsRender && !downloadControlsInUse()) renderDownloads();
            }, 0);
        });

        function renderDownloads(force = false) {
            if (!force && downloadControlsInUse()) {
                deferredDownloadsRender = true;
                return;
            }
            deferredDownloadsRender = false;
            const loadingState = document.getElementById('loadingState');
            const emptyState = document.getElementById('emptyState');
            const grid = document.getElementById('downloadsGrid');
            
            loadingState.style.display = 'none';
            
            if (downloads.length === 0) {
                emptyState.style.display = 'block';
                grid.style.display = 'none';
                return;
            }
            
            emptyState.style.display = 'none';
            grid.style.display = 'grid';
            
            // Actualizar estadísticas
            const totalSize = downloads.reduce((sum, d) => sum + d.size, 0);
            document.getElementById('totalFolders').textContent = downloads.length;
            document.getElementById('totalSize').textContent = formatBytes(totalSize);
            
            // Renderizar tarjetas
            grid.innerHTML = downloads.map(download => {
                const activeJob = activeJobForFolder(download.name);
                const lock = activeJob ? 'disabled title="Mappen används av en pågående nedladdning"' : '';
                const published = catalogs.filter(catalog => catalog.folderName === download.name);
                const message = publicationMessages.get(download.name);
                const publishing = publishingFolders.has(download.name);
                const selectedResolution = chosenResolutions.get(download.name) || String(published[0]?.resolutionMeters || 'original');
                const style = chosenStyles.get(download.name) || published[0]?.hillshadeStyle || { altitude: 35, strength: 1.7 };
                return `
                <div class="download-card">
                    <div class="download-header">
                        <div style="flex: 1;">
                            <div class="download-title">${escapeHtml(download.displayName || download.name)}</div>
                            ${download.displayName ? `<div class="download-folder">${escapeHtml(download.name)}</div>` : ''}
                            ${download.description ? `<p class="download-description">${escapeHtml(download.description)}</p>` : ''}
                            <div class="download-badges">
                                ${activeJob ? `<span class="badge badge-running"><span class="mini-spinner"></span>${activeJob.status === 'stopping' ? 'Stoppas' : 'Pågår'}</span>` : ''}
                                ${download.hasMerged ? '<span class="badge badge-success">✓ Merged</span>' : ''}
                                ${download.hasVrt ? '<span class="badge badge-info">✓ VRT</span>' : ''}
                                ${download.hasTileIndex ? '<span class="badge badge-info">✓ Index</span>' : ''}
                            </div>
                        </div>
                    </div>
                    
                    <div class="download-info">
                        <div class="info-item">
                            <span class="info-label">Storlek</span>
                            <span class="info-value">${formatBytes(download.size)}</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">Filer</span>
                            <span class="info-value">${download.fileCount} (${download.tifCount} TIF)</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">Skapad</span>
                            <span class="info-value">${formatDate(download.created)}</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">Ändrad</span>
                            <span class="info-value">${formatDate(download.modified)}</span>
                        </div>
                    </div>
                    ${published.map(catalog => `
                    <div class="published-catalog" style="margin:10px 0; min-width:0;">
                        <strong>${escapeHtml(catalog.title)} (${escapeHtml(catalog.renderMode === 'ondemand' ? `XYZ vid behov, ${catalog.resolutionMeters === 'original' ? 'original' : catalog.resolutionMeters + ' m'}` : catalog.resolutionMeters === 'original' ? 'original' : catalog.resolutionMeters + ' m')})</strong>
                        <span class="terrain-theme-label">${escapeHtml(terrainThemes[catalog.hillshadeStyle?.theme || 'hillshade'])}${catalog.hillshadeStyle?.theme && catalog.hillshadeStyle.theme !== 'hillshade' ? ` · ${escapeHtml(catalog.hillshadeStyle.minElevation ?? 0)}–${escapeHtml(catalog.hillshadeStyle.maxElevation ?? 1000)} m` : ''}</span>
                        <label style="display:inline-flex;align-items:center;gap:6px;margin:0 10px;">
                            <input type="checkbox" ${catalog.isPublic === false ? '' : 'checked'} onchange="setCatalogAccess('${escapeHtml(catalog.alias)}', this.checked)">
                            Public
                        </label>
                        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;min-width:0;">
                            <input type="text" readonly spellcheck="false" aria-label="XYZ-adress för QGIS, Hajk och Origo" value="${escapeHtml(serviceTileUrl(catalog))}" onclick="this.select()" onfocus="this.select()" style="min-width:0;flex:1;padding:7px 9px;font-family:monospace;font-size:0.82em;">
                            <button type="button" class="btn btn-secondary btn-sm" title="Kopiera XYZ-länk" onclick="copyCatalogLink('${escapeHtml(catalog.alias)}')">Kopiera länk</button>
                            ${catalog.vrtPath ? `<button type="button" class="btn btn-secondary btn-sm" title="Kopiera sökvägen till VRT på servern" onclick="copyVrtPath('${escapeHtml(catalog.alias)}')">Kopiera VRT-sökväg</button>` : ''}
                            ${catalog.isPublic === false ? `<button type="button" class="btn btn-secondary btn-sm" title="Ogiltigförklara tidigare nyckel" onclick="rotateCatalogKey('${escapeHtml(catalog.alias)}')">Ny API-nyckel</button>` : ''}
                            <button type="button" class="btn btn-danger btn-sm" title="Ta bort publicerade karttiles" onclick="unpublishCatalog('${escapeHtml(catalog.alias)}')" ${cleanupSupported ? '' : 'disabled'}>Avpublicera</button>
                        </div>
                        ${catalog.vrtPath ? `<small style="display:block;overflow-wrap:anywhere;margin-top:5px;">VRT på servern: <code>${escapeHtml(catalog.vrtPath)}</code></small>` : ''}
                    </div>`).join('')}
                    ${message ? `<p role="status" style="overflow-wrap:anywhere;">${escapeHtml(message)}</p>` : ''}
                    
                    <div class="download-actions">
                        <div class="download-settings">
                        <label style="display:inline-flex;align-items:center;gap:6px;font-size:0.8em;color:#444;">
                            <span>Upplösning XYZ</span>
                            <select id="resolution-${escapeHtml(download.name)}" onchange="chosenResolutions.set('${escapeHtml(download.name)}', this.value)" style="min-width:90px;padding:6px 8px;border-radius:6px;border:1px solid #ced4da;">
                                ${[['original', 'Original'], ['10', '10 m'], ['20', '20 m'], ['50', '50 m'], ['100', '100 m']].map(([value, label]) => `<option value="${value}" ${selectedResolution === value ? 'selected' : ''}>${label}</option>`).join('')}
                            </select>
                        </label>
                        <label style="display:inline-flex;align-items:center;gap:6px;font-size:0.8em;color:#444;">
                            <span>Ljusvinkel</span>
                            <input type="number" min="15" max="80" step="1" value="${escapeHtml(style.altitude)}" title="Lägre vinkel ger mörkare skuggor (15-80°)" onchange="setHillshadeStyle('${escapeHtml(download.name)}', 'altitude', this.value)" style="width:65px;padding:6px;">°
                        </label>
                        <label style="display:inline-flex;align-items:center;gap:6px;font-size:0.8em;color:#444;">
                            <span>Reliefstyrka</span>
                            <input type="number" min="0.5" max="3" step="0.1" value="${escapeHtml(style.strength)}" title="Högre värde ger mer markerad terräng (0,5-3)" onchange="setHillshadeStyle('${escapeHtml(download.name)}', 'strength', this.value)" style="width:65px;padding:6px;">
                        </label>
                        <label class="terrain-theme-control">
                            <span>Tema</span>
                            <select onchange="setHillshadeStyle('${escapeHtml(download.name)}', 'theme', this.value); renderDownloads(true)">
                                ${Object.entries(terrainThemes).map(([value, label]) => `<option value="${value}" ${(style.theme || 'hillshade') === value ? 'selected' : ''}>${label}</option>`).join('')}
                            </select>
                        </label>
                        ${style.theme && style.theme !== 'hillshade' ? `
                        <label class="terrain-theme-control"><span>Minhöjd (m)</span>
                            <input type="number" min="-12000" max="10000" step="any" value="${escapeHtml(style.minElevation ?? 0)}" onchange="setHillshadeStyle('${escapeHtml(download.name)}', 'minElevation', this.value)">
                        </label>
                        <label class="terrain-theme-control"><span>Maxhöjd (m)</span>
                            <input type="number" min="-12000" max="10000" step="any" value="${escapeHtml(style.maxElevation ?? 1000)}" onchange="setHillshadeStyle('${escapeHtml(download.name)}', 'maxElevation', this.value)">
                        </label>` : ''}
                        </div>
                        <div class="download-command-row">
                        ${activeJob ? `
                        <button class="btn btn-danger btn-sm" onclick="stopJob('${escapeHtml(activeJob.id)}')" ${activeJob.status === 'stopping' ? 'disabled' : ''}>
                            ⏹ Stoppa nedladdning
                        </button>` : ''}
                        <button class="btn btn-primary btn-sm ${publishing ? 'publish-pending' : ''}" onclick="publishCatalog('${escapeHtml(download.name)}', document.getElementById('resolution-${escapeHtml(download.name)}').value)" ${!cleanupSupported || activeJob || !(download.tifCount || download.hasVrt) || publishing ? 'disabled title="Vänta tills TIFF- eller VRT-filerna är klara"' : ''}>
                            ${publishing ? 'Publicerar...' : published.length ? 'Publicera om' : 'Publicera XYZ'}
                        </button>
                        ${published.length ? `<button class="btn btn-secondary btn-sm" onclick="publishCatalog('${escapeHtml(download.name)}', document.getElementById('resolution-${escapeHtml(download.name)}').value, true)" ${activeJob || publishing ? 'disabled' : ''}>Publicera nytt tema</button>` : ''}
                        <button class="btn btn-success btn-sm" onclick="downloadFolder('${escapeHtml(download.name)}')" ${lock}>
                            ⬇️ Ladda ner ZIP
                        </button>
                        <button class="btn btn-secondary btn-sm" onclick="openMetaEditor('${escapeHtml(download.name)}')">✏️ Namn &amp; beskrivning</button>
                        ${download.tifCount ? `<a class="btn btn-secondary btn-sm" href="download-viewer.html?folder=${encodeURIComponent(download.name)}">🗺️ Visa rutor${canDeleteDownloads ? ' / ta bort' : ''}</a>` : ''}
                        ${canDeleteDownloads ? `<button class="btn btn-danger btn-sm" onclick="deleteFolder('${escapeHtml(download.name)}')" ${!cleanupSupported || activeJob || publishing ? 'disabled' : ''}>
                            🗑️ Ta bort
                        </button>` : ''}
                        </div>
                    </div>
                    ${!cleanupSupported ? '<p role="status">Starta om servern för att aktivera publicering och säker radering.</p>' : ''}
                </div>
            `;
            }).join('');
        }
        
        function downloadFolder(folderName) {
            const url = `/lmv/downloads/download/${encodeURIComponent(folderName)}`;
            window.location.href = url;
        }

        let editingFolder = null;
        function openMetaEditor(folderName) {
            const download = downloads.find(item => item.name === folderName);
            if (!download) return;
            editingFolder = folderName;
            document.getElementById('metaFolder').textContent = folderName;
            document.getElementById('metaName').value = download.displayName || '';
            document.getElementById('metaDescription').value = download.description || '';
            document.getElementById('metaError').textContent = '';
            document.getElementById('metaDialog').showModal();
        }

        document.getElementById('metaForm').addEventListener('submit', async event => {
            event.preventDefault();
            if (!editingFolder) return;
            try {
                const response = await fetch(`/lmv/downloads/${encodeURIComponent(editingFolder)}/meta`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        displayName: document.getElementById('metaName').value,
                        description: document.getElementById('metaDescription').value
                    })
                });
                const data = await response.json();
                if (!response.ok || !data.success) throw new Error(data.error || 'Kunde inte spara.');
                document.getElementById('metaDialog').close();
                await loadDownloads();
            } catch (error) {
                document.getElementById('metaError').textContent = error.message;
            }
        });

        async function fetchServiceKey(catalog) {
            try {
                const response = await fetch(`/terrain/${encodeURIComponent(catalog.alias)}/api-key`);
                const data = await response.json();
                if (response.ok && data.apiKey) serviceKeys.set(catalog.alias, data.apiKey);
            } catch (error) {
                console.warn('Kunde inte hämta API-nyckel:', error.message);
            }
            return serviceKeys.get(catalog.alias);
        }

        function setHillshadeStyle(folderName, field, value) {
            const published = catalogs.find(catalog => catalog.folderName === folderName);
            const style = chosenStyles.get(folderName) || published?.hillshadeStyle || { altitude: 35, strength: 1.7 };
            chosenStyles.set(folderName, { ...style, [field]: field === 'theme' ? value : Number(value) });
        }

        async function publishCatalog(folderName, resolutionOverride, newCatalog = false) {
            if (sessionStorage.getItem('terrainPublishJob')) {
                alert('En katalog publiceras redan i den här fliken.');
                return;
            }
            const published = catalogs.find(catalog => catalog.folderName === folderName);
            const selectedTheme = chosenStyles.get(folderName)?.theme || published?.hillshadeStyle?.theme || 'hillshade';
            const baseAlias = published?.alias || folderName.replace(/^LMV_DOWNLOADS_/, '').replace(/[^a-zA-Z0-9_-]+/g, '_').toLowerCase();
            const alias = prompt('Ange alias för katalogen (får bara innehålla a-z, 0-9, bindestreck och underscore):', newCatalog ? `${baseAlias}-${selectedTheme}` : baseAlias);
            if (!alias) return;
            const normalizedAlias = alias.trim().toLowerCase().replace(/[^a-z0-9_-]+/g, '_').replace(/^_+|_+$/g, '').slice(0, 80) || 'catalog';
            if (newCatalog && catalogs.some(catalog => catalog.alias === normalizedAlias)) {
                publicationMessages.set(folderName, 'Alias finns redan. Välj ett nytt alias för temat.');
                renderDownloads();
                return;
            }

            const hillshadeStyle = chosenStyles.get(folderName) || published?.hillshadeStyle || { altitude: 35, strength: 1.7 };
            if (!Number.isFinite(hillshadeStyle.altitude) || hillshadeStyle.altitude < 15 || hillshadeStyle.altitude > 80 || !Number.isFinite(hillshadeStyle.strength) || hillshadeStyle.strength < 0.5 || hillshadeStyle.strength > 3) {
                publicationMessages.set(folderName, 'Ljusvinkel: 15-80°, reliefstyrka: 0,5-3.');
                renderDownloads();
                return;
            }
            if (!Number.isFinite(Number(hillshadeStyle.minElevation ?? 0)) || !Number.isFinite(Number(hillshadeStyle.maxElevation ?? 1000)) ||
                Number(hillshadeStyle.minElevation ?? 0) >= Number(hillshadeStyle.maxElevation ?? 1000)) {
                publicationMessages.set(folderName, 'Minsta höjd måste vara lägre än största höjd.');
                renderDownloads();
                return;
            }

            try {
                publishingFolders.add(folderName);
                publicationMessages.set(folderName, 'Registrerar rasterkälla för XYZ on-demand...');
                renderDownloads();
                const response = await fetch('/terrain/publish', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        folderName,
                        alias,
                        title: alias.replace(/_/g, ' '),
                        resolutionMeters: resolutionOverride || 'original',
                        hillshadeStyle
                    })
                });
                const data = await response.json();
                if (!data.success) throw new Error(data.error || 'Kunde inte publicera katalogen');
                sessionStorage.setItem('terrainPublishJob', JSON.stringify({ id: data.jobId, folderName }));
                await waitForPublication(data.jobId, folderName);
            } catch (error) {
                console.error('publishCatalog failed:', error);
                publicationMessages.set(folderName, error.message);
                renderDownloads();
            } finally {
                publishingFolders.delete(folderName);
                renderDownloads();
            }
        }

        async function waitForPublication(jobId, folderName) {
            publishingFolders.add(folderName);
            publicationMessages.set(folderName, 'Registrerar rasterkälla för XYZ on-demand...');
            renderDownloads();
            try {
                let data;
                do {
                    const response = await fetch(`/terrain/publish/status/${encodeURIComponent(jobId)}`);
                    data = await response.json();
                    if (!data.success) throw new Error(data.error || 'Publiceringsjobb hittades inte.');
                    if (data.status === 'running') await new Promise(resolve => setTimeout(resolve, 3000));
                } while (data.status === 'running');

                if (data.status !== 'done') throw new Error(data.error || 'Publiceringen misslyckades.');
                if (data.catalog.apiKey) serviceKeys.set(data.catalog.catalogId, data.catalog.apiKey);
                publicationMessages.delete(folderName);
                await loadDownloads();
            } catch (error) {
                publicationMessages.set(folderName, error.message);
                renderDownloads();
            } finally {
                publishingFolders.delete(folderName);
                sessionStorage.removeItem('terrainPublishJob');
                renderDownloads();
            }
        }

        async function copyCatalogLink(alias) {
            const catalog = catalogs.find(item => item.alias === alias);
            if (!catalog) return;
            try {
                let key = serviceKeys.get(alias);
                if (catalog.isPublic === false && !key) key = await fetchServiceKey(catalog);
                if (catalog.isPublic === false && !key) {
                    key = prompt('Nyckeln är inte sparad på servern. Ange API-nyckeln, eller avbryt och skapa en ny:');
                    if (!key) return;
                    if (!/^[a-f0-9]{64}$/.test(key)) throw new Error('Ogiltig API-nyckel.');
                    serviceKeys.set(alias, key);
                }
                await navigator.clipboard.writeText(serviceTileUrl(catalog, key));
                publicationMessages.set(catalog.folderName, 'XYZ-länk kopierad.');
            } catch (error) {
                publicationMessages.set(catalog.folderName, 'Kunde inte kopiera länken.');
            }
            renderDownloads();
        }

        async function copyVrtPath(alias) {
            const catalog = catalogs.find(item => item.alias === alias);
            if (!catalog?.vrtPath) return;
            try {
                await navigator.clipboard.writeText(catalog.vrtPath);
                publicationMessages.set(catalog.folderName, 'VRT-sökväg kopierad. VRT-filen kan öppnas direkt i QGIS på serverdatorn.');
            } catch (error) {
                publicationMessages.set(catalog.folderName, 'Kunde inte kopiera VRT-sökvägen.');
            }
            renderDownloads();
        }

        async function setCatalogAccess(alias, isPublic, rotateKey = false) {
            const catalog = catalogs.find(item => item.alias === alias);
            if (!catalog) return;
            try {
                const response = await fetch(`/terrain/${encodeURIComponent(alias)}/access`, {
                    method: 'PATCH', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ isPublic, rotateKey })
                });
                const result = await response.json();
                if (!response.ok) throw new Error(result.error || 'Kunde inte ändra åtkomst.');
                serviceKeys.delete(alias);
                if (result.apiKey) serviceKeys.set(alias, result.apiKey);
                publicationMessages.set(catalog.folderName, result.apiKey ? 'Ny API-nyckel skapad. Gamla länkar slutar fungera.' : isPublic ? 'Tjänsten är publik.' : 'Tjänsten är privat. Befintlig API-nyckel används.');
                await loadDownloads();
            } catch (error) {
                publicationMessages.set(catalog.folderName, error.message);
                renderDownloads();
            }
        }

        async function rotateCatalogKey(alias) {
            if (!confirm('Skapa en ny API-nyckel? Den förra slutar fungera direkt.')) return;
            await setCatalogAccess(alias, false, true);
        }

        async function unpublishCatalog(alias) {
            const catalog = catalogs.find(item => item.alias === alias);
            if (!catalog || !confirm(`Avpublicera "${catalog.title}" och radera dess karttiles? Nedladdade originalfiler behålls.`)) return;
            try {
                const response = await fetch(`/terrain/${encodeURIComponent(alias)}`, { method: 'DELETE' });
                const data = await response.json();
                if (!data.success) throw new Error(data.error || 'Kunde inte avpublicera.');
                serviceKeys.delete(alias);
                publicationMessages.delete(catalog.folderName);
                await loadDownloads();
            } catch (error) {
                publicationMessages.set(catalog.folderName, error.message);
                renderDownloads();
            }
        }
        
        async function deleteFolder(folderName) {
            if (!confirm(`Ta bort "${folderName}" och alla publicerade kataloger/tiles som hör till mappen?\n\nDetta går inte att ångra.`)) {
                return;
            }
            
            try {
                const response = await fetch(`/lmv/downloads/delete/${encodeURIComponent(folderName)}`, {
                    method: 'DELETE'
                });
                
                const data = await response.json();
                
                if (data.success) {
                    publicationMessages.delete(folderName);
                    await loadDownloads();
                } else {
                    throw new Error(data.error);
                }
            } catch (error) {
                console.error('Fel vid borttagning av mapp:', error);
                alert('Kunde inte ta bort mappen: ' + error.message);
            }
        }
        
        function refreshList() {
            document.getElementById('loadingState').style.display = 'block';
            document.getElementById('downloadsGrid').style.display = 'none';
            document.getElementById('emptyState').style.display = 'none';
            loadDownloads();
        }

        // --- LIVE JOBB ---
        const PHASE_TEXT = {
            start: 'Startar...',
            search: 'Söker filer hos Lantmäteriet...',
            download: 'Laddar ner',
            optimize: 'Slutför optimering (COG)...',
            vrt: 'Skapar VRT för QGIS...',
            finished: 'Klar'
        };
        const STATUS_TEXT = { running: 'Pågår', stopping: 'Stoppas...', done: 'Klar', cancelled: 'Stoppad', failed: 'Misslyckades' };

        function jobTitle(job) {
            const kind = job.type === 'hojd' ? '🗺️ Höjddata' : `📍 Vektordata (${job.collectionId})`;
            return `${kind} – ${job.label}`;
        }

        function renderJobProgress(job) {
            const p = job.progress || {};
            if (!isActive(job)) return '';
            const lines = [];
            if (p.collectionCount) lines.push(`Samling ${p.collectionIndex}/${p.collectionCount}${p.collection ? `: ${p.collection}` : ''}`);
            else if (p.collection) lines.push(`Samling: ${p.collection}`);

            let pct = null;
            if (p.phase === 'search') {
                lines.push(`${PHASE_TEXT.search} ${p.found ? `(${p.found} hittade hittills)` : ''}`);
            } else if (p.phase === 'download' && p.total) {
                pct = Math.round((p.done / p.total) * 100);
                lines.push(`Filer: ${p.done}/${p.total} – ${p.existing || 0} fanns redan, ${p.downloaded || 0} nya${p.failed ? `, ${p.failed} misslyckade` : ''}`);
            } else {
                lines.push(PHASE_TEXT[p.phase] || '');
            }
            if (job.type === 'hojd' && (p.optimized || p.optimizeWaiting)) {
                lines.push(`Optimering (COG): ${p.optimized} klara, ${p.optimizeWaiting} i kö`);
            }
            const fill = pct === null
                ? '<div class="job-bar-fill indeterminate"></div>'
                : `<div class="job-bar-fill" style="width:${pct}%"></div>`;
            return `
                <div class="job-progress">
                    <div class="job-bar">${fill}</div>
                    ${lines.filter(Boolean).map(l => `<div class="job-detail">${escapeHtml(l)}</div>`).join('')}
                </div>`;
        }

        function renderJobs() {
            const section = document.getElementById('jobsSection');
            const list = document.getElementById('jobsList');
            const dismissed = getDismissed();
            const visible = jobs.filter(j => isActive(j) || !dismissed.has(j.id));
            section.style.display = visible.length ? 'block' : 'none';
            document.getElementById('clearFinishedBtn').style.display = visible.some(j => !isActive(j)) ? 'inline-block' : 'none';

            list.innerHTML = visible.map(job => {
                const active = isActive(job);
                const statusIcon = active ? '<span class="mini-spinner"></span>' : '';
                const stopBtn = active
                    ? `<button class="btn btn-danger btn-sm" onclick="stopJob('${escapeHtml(job.id)}')" ${job.status === 'stopping' ? 'disabled' : ''}>⏹ Stoppa</button>`
                    : `<button class="btn btn-secondary btn-sm" onclick="dismissJob('${escapeHtml(job.id)}')">Dölj</button>`;
                const when = job.finishedAt ? `Avslutad ${formatDate(job.finishedAt)}` : `Startad ${formatDate(job.startedAt)}`;
                return `
                    <div class="job-card status-${escapeHtml(job.status)}">
                        <div class="job-top">
                            <div>
                                <div class="job-title">${escapeHtml(jobTitle(job))}</div>
                                <div class="job-sub">${escapeHtml(when)}</div>
                            </div>
                            <div style="display:flex; gap:8px; align-items:center;">
                                <span class="job-status ${escapeHtml(job.status)}">${statusIcon}${escapeHtml(STATUS_TEXT[job.status] || job.status)}</span>
                                ${stopBtn}
                            </div>
                        </div>
                        ${renderJobProgress(job)}
                        ${job.message ? `<div class="job-message">${escapeHtml(job.message)}</div>` : ''}
                    </div>`;
            }).join('');
        }

        function showToast(job) {
            const toast = document.getElementById('toast');
            toast.className = job.status;
            toast.innerHTML = `<span class="toast-close" onclick="this.parentElement.style.display='none'">✕</span>${escapeHtml(job.message)}`;
            toast.style.display = 'block';
            clearTimeout(toast._timer);
            toast._timer = setTimeout(() => { toast.style.display = 'none'; }, 15000);
        }

        async function pollJobs() {
            try {
                const res = await fetch('/lmv/jobs');
                const data = await res.json();
                if (data.success) {
                    jobs = data.jobs;
                    let justFinished = false;
                    for (const job of jobs) {
                        const prev = knownJobStatus.get(job.id);
                        if (!firstJobsPoll && prev && isActive({ status: prev }) && !isActive(job)) {
                            justFinished = true;
                            showToast(job);
                        }
                        knownJobStatus.set(job.id, job.status);
                    }
                    firstJobsPoll = false;
                    renderJobs();

                    const anyActive = jobs.some(isActive);
                    if (justFinished || (anyActive && Date.now() - lastFolderRefresh > 5000)) {
                        lastFolderRefresh = Date.now();
                        await loadDownloads();
                    }
                }
            } catch (e) {
                console.warn('Kunde inte hämta jobbstatus:', e.message);
            } finally {
                setTimeout(pollJobs, 2000);
            }
        }

        async function stopJob(jobId) {
            if (!confirm('Vill du stoppa nedladdningen? Pågående optimering stoppas också. Redan nedladdade filer finns kvar.')) return;
            try {
                const res = await fetch('/lmv/cancel-download', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ downloadId: jobId })
                });
                const data = await res.json();
                if (!data.success) alert(data.error || 'Kunde inte stoppa jobbet.');
                const job = jobs.find(j => j.id === jobId);
                if (job && data.success) { job.status = 'stopping'; renderJobs(); renderDownloads(); }
            } catch (e) {
                alert('Nätverksfel vid stopp: ' + e.message);
            }
        }

        function dismissJob(jobId) {
            const dismissed = getDismissed();
            dismissed.add(jobId);
            localStorage.setItem(DISMISSED_KEY, JSON.stringify([...dismissed]));
            renderJobs();
        }

        function dismissFinishedJobs() {
            const dismissed = getDismissed();
            jobs.filter(j => !isActive(j)).forEach(j => dismissed.add(j.id));
            localStorage.setItem(DISMISSED_KEY, JSON.stringify([...dismissed]));
            renderJobs();
        }
        
        // Cargar al inicio
        loadDownloads();
        pollJobs();
        try {
            const pending = JSON.parse(sessionStorage.getItem('terrainPublishJob') || 'null');
            if (pending && pending.id) waitForPublication(pending.id, pending.folderName);
        } catch (error) { sessionStorage.removeItem('terrainPublishJob'); }
    </script>
</body>
